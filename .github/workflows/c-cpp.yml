name: C/C++ CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy bear
          
    - name: Build
      run: |
          bear -- g++ main.cpp -o main
      
    - name: Run clang-tidy
      uses: ZedThree/clang-tidy-review@v0.23.1
      id: clang-tidy
      with:
          build_dir: .
          annotations: true
          num_comments_as_exitcode: true
